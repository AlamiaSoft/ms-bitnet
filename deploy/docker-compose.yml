services:
  bitnet:
    image: mcr.microsoft.com/appsvc/docs/sidecars/sample-experiment:bitnet-b1.58-2b-4t-gguf
    container_name: bitnet-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434" # Binds locally so Cloudflare Tunnel can route to it, but keeps it off the public internet
    environment:
      - SLM_PORT=11434
      - WEBSITE_SLM_STARTUP_ARGUMENTS=-t ${BITNET_THREADS:-4} --repeat-penalty ${BITNET_REPEAT_PENALTY:-1.15} --repeat-last-n 64 --top-p ${BITNET_TOP_P:-0.9} --min-p ${BITNET_MIN_P:-0.05} --temp ${BITNET_TEMP:-0.7}
